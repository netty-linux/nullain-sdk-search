[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "nullain-search"
version = "0.1.0"
description = "Local full-text search (tantivy-backed) for nullain-agent-sdk, via Rust/PyO3 bindings."
readme = "../README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "nullain_search"
features = ["pyo3/extension-module"]
