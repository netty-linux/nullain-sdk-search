[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "nullain-search"
version = "0.1.0"
description = "Local full-text search (tantivy-backed) for nullain-agent-sdk, via Rust/PyO3 bindings."
readme = "../README.md"
authors = [{ name = "Nullain" }]
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = ["search", "full-text-search", "tantivy", "bm25", "nullain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/netty-linux/nullain-sdk-search"
Repository = "https://github.com/netty-linux/nullain-sdk-search"
Issues = "https://github.com/netty-linux/nullain-sdk-search/issues"

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "nullain_search"
features = ["pyo3/extension-module"]
